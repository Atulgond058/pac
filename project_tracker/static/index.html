<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Tracker</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <nav>
    <b>Project Tracker</b>
    <button class="link" data-view="submit">Submit project</button>
    <button class="link" data-view="status">Check status</button>
    <button class="link" data-view="teacher" id="teacherLink">Teacher login</button>
    <button class="link hidden" id="logoutBtn">Log out</button>
  </nav>
</header>

<main>
  <div id="msg" class="msg hidden" role="status"></div>

  <section id="view-submit">
    <h1>Submit your project</h1>
    <p class="sub">One submission per roll number. Your teacher will review it.</p>
    <form id="submitForm" class="card">
      <label for="student_name">Student name</label><input id="student_name" required>
      <label for="roll_no">Roll number</label><input id="roll_no" required>
      <label for="project_title">Project title</label><input id="project_title" required>
      <label for="tech_stack">Tech stack</label><input id="tech_stack" placeholder="e.g. Python, SQLite">
      <p><button>Submit project</button></p>
    </form>
  </section>

  <section id="view-status" class="hidden">
    <h1>Check approval status</h1>
    <p class="sub">Enter your roll number.</p>
    <form id="statusForm" class="card">
      <label for="check_roll">Roll number</label><input id="check_roll" required>
      <p><button>Check status</button></p>
    </form>
    <div id="statusResult" class="card result hidden"></div>
  </section>

  <section id="view-login" class="hidden">
    <h1>Teacher login</h1>
    <p class="sub">Demo login: teacher / admin123</p>
    <form id="loginForm" class="card">
      <label for="username">Username</label><input id="username" required>
      <label for="password">Password</label><input id="password" type="password" required>
      <p><button>Log in</button></p>
    </form>
  </section>

  <section id="view-dashboard" class="hidden">
    <h1>Review projects</h1>
    <p class="sub" id="stats"></p>
    <div class="tabs" id="tabs"></div>
    <div class="wrap">
      <table>
        <thead><tr><th>Student</th><th>Roll no</th><th>Title</th><th>Tech stack</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="hidden">No projects in this view.</p>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
